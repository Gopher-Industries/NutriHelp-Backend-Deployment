name: Nutrition records migration tests

on:
  pull_request:
    branches: [main, develop, master]
  push:
    branches: [main, develop, master, feature/ticket-46-meal-log-table]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nutrition-records-tests:
    name: Nutrition records SQL regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run SQL regression tests in disposable databases
        run: npm run test:nutrition-records
