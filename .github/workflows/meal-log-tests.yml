name: Meal log tests

on:
  pull_request:
    branches: [main, develop, master]
  push:
    branches: [main, develop, master, feature/ticket-47-meal-log-endpoint]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meal-log-tests:
    name: Meal log HTTP and SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run meal log HTTP and SQL integration tests
        run: npm run test:meallog
